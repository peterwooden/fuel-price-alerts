name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - name: Backend tests
        working-directory: backend
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Terraform format and validate
        working-directory: terraform
        run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate

  deploy:
    name: Build and deploy
    needs: test
    # Only main deploys; branches and PRs just run the tests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy # never two terraform applies at once
    permissions:
      id-token: write # for AWS OIDC; no AWS keys are stored in GitHub
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::032326623602:role/fuel-price-alerts-github-deploy
          aws-region: ap-southeast-2
      - name: Run deploy script
        run: ./build-and-deploy.sh
